<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cachuda17</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      background-image: url('fondo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Playfair Display', Georgia, serif; 
      color: #2b2b2b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .page-title {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .page-title h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 600;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .img-frame {
      border: 1px solid #d1d1d1;
      padding: 6px;
      background-color: #ffffff;
      border-radius: 6px;
    }

    .img-frame img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      border-radius: 2px;
    }

    /* Cuadro de texto abajo de las fotos */
    .main-text-box {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      font-size: 1.1rem;
      line-height: 1.6;
      text-align: center;
    }

    .main-text-box p {
      margin: 0;
      color: #2b2b2b;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Título arriba de las fotos -->
    <div class="page-title">
      <h1>Cachuda17</h1>
    </div>

    <!-- Foto 1 -->
    <div class="card">
      <div class="img-frame">
        <img src="foto1.jpg" alt="Foto 1">
      </div>
    </div>

    <!-- Foto 2 -->
    <div class="card">
      <div class="img-frame">
        <img src="foto2.jpg" alt="Foto 2">
      </div>
    </div>

    <!-- Foto 3 -->
    <div class="card">
      <div class="img-frame">
        <img src="foto3.jpg" alt="Foto 3">
      </div>
    </div>

    <!-- Foto 4 -->
    <div class="card">
      <div class="img-frame">
        <img src="foto4.jpg" alt="Foto 4">
      </div>
    </div>

    <!-- Mensaje final dentro del cuadro blanco -->
    <div class="main-text-box">
      <p>Que onda blo, nada más para decirte que tkm, y que te vayas a la cola, na ntc, ya no estes de arrastrada bro y más focus al brawl jajaj, tu si sabes q pedo con la vida, tkm cagona 💕</p>
    </div>

  </div>

</body>
</html>
